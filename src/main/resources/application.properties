# ===== Server =====
server.port=8080

# ===== PostgreSQL =====
spring.datasource.url=jdbc:postgresql://postgres:5432/thaitheatre
spring.datasource.username=postgres
spring.datasource.password=P@ssw0rd
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP (ปรับตามสเปคเครื่องได้)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.pool-name=HikariPool-API

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ===== JSON =====
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false

# ===== CORS =====
# NOTE: จริง ๆ CORS ตั้งใน SecurityConfig เป็น allowedOriginPatterns("*") อยู่แล้ว
# ค่าด้านล่างนี้ยังไม่ถูกใช้ในโค้ดปัจจุบัน (เก็บไว้เผื่ออนาคต)
app.cors.allowed-origins=http://localhost:4200

# ===== JWT =====
app.jwt.secret=replace-this-with-32+chars-strong-secret
app.jwt.exp-minutes=60

# Swagger UI
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html


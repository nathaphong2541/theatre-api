# ===== Server =====
server.port=8080

# ===== PostgreSQL =====
spring.datasource.url=jdbc:postgresql://150.95.24.79:5432/thaitheatre?sslmode=disable
spring.datasource.username=postgres
spring.datasource.password=P@ssw0rd
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP (ปรับตามสเปคเครื่องได้)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.pool-name=HikariPool-API

# ===== JPA / Hibernate =====
# Flyway owns the schema now; Hibernate only validates it matches the entities.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ===== Flyway (DB migrations) =====
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Existing production DB → baseline it as V1 so Flyway adopts the current schema.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=existing schema baseline

# ===== JSON =====
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false

# ===== CORS (แก้ origin ให้ตรงกับ Frontend ของคุณ) =====
app.cors.allowed-origins=http://localhost:4200

# ===== JWT =====
app.jwt.secret=replace-this-with-32+chars-strong-secret
app.jwt.exp-minutes=60

# Swagger UI
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html


# =====================================================================
#  LOCAL DEV profile.  Run the API on your machine with:
#     mvnw spring-boot:run -Dspring-boot.run.profiles=local
#  UI runs with `npm start` (localhost:4200 -> localhost:8080) so the
#  auth cookie is same-site (Lax) and survives a refresh.
# =====================================================================

server.port=8080

# ===== PostgreSQL (the DB container on the VM, published on :5432) =====
spring.datasource.url=jdbc:postgresql://34.21.164.108:5432/thaitheatre
spring.datasource.username=postgres
spring.datasource.password=P@ssw0rd
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.pool-name=HikariPool-API

# ===== JPA / Hibernate =====
# Flyway (configured in application.properties) owns the schema; validate only.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false

# ===== CORS: allow the local Angular dev server =====
app.cors.allowed-origins=http://localhost:4200

# ===== JWT =====
app.jwt.secret=replace-this-with-32+chars-strong-secret
app.jwt.exp-minutes=60

# ===== Auth cookie for local http dev =====
# Lax works for localhost:4200 -> localhost:8080 (same-site, different port).
# secure=false because local dev is plain http.
app.cookie.secure=false
app.cookie.same-site=Lax
app.cookie.max-age-seconds=7200

# Swagger UI
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# mail
